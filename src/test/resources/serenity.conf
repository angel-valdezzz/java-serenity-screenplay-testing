webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    "goog:chromeOptions" {
      args = ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1440,900"]
    }
  }
}
serenity.project.name = "ParaBank and Demo Users API — Screenplay"
serenity.take.screenshots = FOR_FAILURES
